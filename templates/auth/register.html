{% extends 'base.html' %}
{% block title %}Đăng ký – Thư viện Số{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm auth-card">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="auth-logo">📚</div>
          <h1 class="h5 fw-bold">Tạo tài khoản thành viên</h1>
          <p class="small text-muted mb-0">Miễn phí — chỉ mất 1 phút!</p>
        </div>

        {% if error %}
        <div class="alert alert-danger py-2 small">{{ error }}</div>
        {% endif %}

        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold small">Tên đăng nhập *</label>
            <input class="form-control" name="username" required minlength="3" maxlength="30"
                   placeholder="Ít nhất 3 ký tự" value="{{ request.form.get('username', '') }}">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold small">Email</label>
            <input type="email" class="form-control" name="email"
                   placeholder="name@example.com" value="{{ request.form.get('email', '') }}">
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold small">Mật khẩu *</label>
              <input type="password" class="form-control" name="password" required minlength="6"
                     placeholder="Ít nhất 6 ký tự">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label fw-semibold small">Xác nhận mật khẩu *</label>
              <input type="password" class="form-control" name="confirm" required minlength="6"
                     placeholder="Nhập lại mật khẩu">
            </div>
          </div>
          <button class="btn btn-primary w-100 py-2">Đăng ký</button>
        </form>

        <hr>
        <p class="small text-center text-muted mb-0">
          Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
